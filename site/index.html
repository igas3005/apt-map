<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수도권 단지 시세 지도</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="top">
      <h1>수도권 단지 시세 지도</h1>
      <div class="sbox">
        <input id="q" type="search" autocomplete="off" placeholder="주소·건물명 검색 (예: 서울 강남구 개포동 1280)">
        <button id="go" class="pri">검색</button>
        <div id="sug" class="sug"></div>
      </div>
      <div class="ctrl">
        <label>반경<select id="rad"><option value="500">500m</option><option value="1000" selected>1km</option><option value="2000">2km</option><option value="3000">3km</option></select></label>
        <label>기간<select id="mon"><option value="3">3개월</option><option value="6">6개월</option><option value="12" selected>12개월</option></select></label>
        <label>면적<select id="band"></select></label>
        <label>표시<select id="metric"><option value="latest">최근 거래가</option><option value="median">중위 거래가</option></select></label>
        <label>정렬<select id="sort"><option value="dist">가까운 순</option><option value="price">가격 높은 순</option><option value="cnt">거래 많은 순</option></select></label>
      </div>
      <div id="status" class="status"></div>
    </div>
    <div id="detail" hidden></div>
    <div id="list"></div>
    <footer id="foot">국토교통부 아파트 매매 실거래가 기준 · 해제 거래 제외 · 참고용</footer>
  </aside>
  <main id="map"><div class="maphint" id="maphint">주소를 검색하거나 지도를 클릭해 중심을 정하세요.</div></main>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
