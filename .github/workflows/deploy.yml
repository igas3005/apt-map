name: 사이트 배포

on:
  workflow_dispatch:         # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: app.js 만들기 (src/ 파일 합치기) + 문법 검사
        run: |
          bash scripts/build.sh
          node --check site/app.js

      - name: 카카오 JavaScript 키 주입
        env:
          KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
        run: |
          printf 'window.APP_CONFIG = { KAKAO_JS_KEY: "%s" };\n' "$KAKAO_JS_KEY" > site/config.js

      - name: 캐시 방지용 버전 표시 (배포할 때마다 브라우저가 새 파일을 받도록)
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$V\"|; s|src=\"config.js\"|src=\"config.js?v=$V\"|; s|src=\"app.js\"|src=\"app.js?v=$V\"|" site/index.html
          grep -n "?v=" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
